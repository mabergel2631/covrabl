<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f33"/>
      <stop offset="45%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2a4d7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:rgba(63,167,163,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <circle cx="600" cy="180" r="40" fill="none" stroke="#3FA7A3" stroke-width="3" opacity="0.9"/>
  <text x="600" y="192" text-anchor="middle" fill="#fff" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">C</text>

  <!-- Brand name -->
  <text x="600" y="260" text-anchor="middle" fill="#fff" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">COVRABL</text>

  <!-- Headline -->
  <text x="600" y="340" text-anchor="middle" fill="#fff" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.02em">Know What You're Covered For</text>

  <!-- Subline -->
  <text x="600" y="400" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400">Upload your policies. See your real coverage. Spot the gaps.</text>

  <!-- Bottom accent line -->
  <rect x="540" y="460" width="120" height="3" rx="1.5" fill="#3FA7A3" opacity="0.8"/>

  <!-- URL -->
  <text x="600" y="530" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter, -apple-system, sans-serif" font-size="16" letter-spacing="0.1em">covrabl.com</text>
</svg>
